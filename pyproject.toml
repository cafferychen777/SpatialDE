[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialde-modern"
version = "1.1.3.post1"
description = "Maintained Python 3 fork of SpatialDE"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Valentine Svensson"},
]
maintainers = [
    {name = "Chen Yang", email = "cafferychen777@tamu.edu"},
]
dependencies = [
    "click>=8",
    "matplotlib>=3.7",
    "naivede-modern>=1.3.1.post1,<2",
    "numpy>=1.24",
    "pandas>=1.5",
    "scipy>=1.10",
    "tqdm>=4.60",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/cafferychen777/SpatialDE"
Repository = "https://github.com/cafferychen777/SpatialDE"
"Original project" = "https://github.com/Teichlab/SpatialDE"
Issues = "https://github.com/cafferychen777/SpatialDE/issues"

[project.scripts]
spatialde = "SpatialDE.scripts.spatialde_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["SpatialDE", "SpatialDE.*"]
