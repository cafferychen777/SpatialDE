name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install test and build tools
        run: python -m pip install . pytest ruff build twine
      - name: Check source and tests
        run: |
          python -m compileall -q src
          ruff check --select E9,F63,F7,F82 src tests
          python -m pytest -q
      - name: Run numerical smoke test
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          import SpatialDE

          rng = np.random.default_rng(42)
          side = 5
          x, y = np.meshgrid(np.arange(side), np.arange(side))
          coordinates = pd.DataFrame({"x": x.ravel(), "y": y.ravel()})
          trend = coordinates["x"].to_numpy() + coordinates["y"].to_numpy()
          expression = pd.DataFrame(
              {
                  "spatial_gene": trend + rng.normal(0, 0.15, trend.size),
                  "noise_gene_1": rng.normal(0, 1, trend.size),
                  "noise_gene_2": rng.normal(0, 1, trend.size),
              }
          )
          results = SpatialDE.run(coordinates, expression)
          assert results.sort_values("pval").iloc[0]["g"] == "spatial_gene"
          assert np.isfinite(results[["pval", "qval"]].to_numpy()).all()
          PY
      - name: Build and verify distributions
        run: |
          python -m build
          python -m twine check dist/*
